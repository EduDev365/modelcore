[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelcore"
version = "1.4.0"
description = "Lightweight, production-oriented model infrastructure for Python AI applications."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = ["ai", "llm", "model", "openai", "ollama", "resilience", "telemetry"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["pydantic>=2.9"]

[project.urls]
Homepage = "https://github.com/EduDev365/modelcore"
Repository = "https://github.com/EduDev365/modelcore"
Issues = "https://github.com/EduDev365/modelcore/issues"
Changelog = "https://github.com/EduDev365/modelcore/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "opentelemetry-sdk>=1.39,<2"]
dev = ["mypy>=1.13", "ruff>=0.8", "build>=1.2", "twine>=6.0"]
openai = ["openai>=1.0"]
ollama = ["ollama>=0.6"]
otel = ["opentelemetry-api>=1.39,<2"]
redis = ["redis>=5.0,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
modelcore = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: opt-in tests that contact configured external services"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/modelcore"]
check_untyped_defs = true
disallow_any_generics = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
